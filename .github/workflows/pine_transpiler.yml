name: Transpile Model to Pine Script

on:
  push:
    paths:
      - 'universal_strategy.joblib'
      - 'transpiler.py'
  workflow_dispatch:

jobs:
  transpile:
    runs-on: ubuntu-latest
    permissions:
      contents: write 

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        # Pinned scikit-learn version to match the serialized model environment
        run: pip install joblib numpy scikit-learn==1.9.0

      - name: Execute Transpiler
        run: python transpiler.py

      - name: Commit and Push Pine Script
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add strategy.pine
          git commit -m "Auto-generated updated Pine Script from model" || echo "No changes to commit"
          git push
